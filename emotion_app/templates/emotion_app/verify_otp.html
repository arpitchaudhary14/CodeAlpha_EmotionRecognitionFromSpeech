{% extends 'emotion_app/base.html' %}

{% block title %}Verify OTP | ResoNate{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-panel">
        <h2>Set New Password</h2>
        <p>Enter the OTP sent to your email along with your new password.</p>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="{% url 'verify_otp' %}" class="auth-form mt-4">
            {% csrf_token %}
            <div class="form-group">
                <label for="otp">Enter 6-digit OTP</label>
                <input type="text" name="otp" id="otp" required maxlength="6" pattern="\d{6}" class="form-control text-center tracking-widest">
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" required class="form-control">
            </div>
            <button type="submit" class="btn primary-btn w-100">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
