{% extends 'emotion_app/base.html' %}

{% block title %}Password Reset | ResoNate{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-panel">
        <h2>Reset Password</h2>
        <p>Enter your email address to receive an OTP to reset your password.</p>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="{% url 'password_reset' %}" class="auth-form mt-4">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required class="form-control">
            </div>
            <button type="submit" class="btn primary-btn w-100">Send Reset OTP</button>
        </form>
        <div class="auth-redirect mt-4 text-center">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
